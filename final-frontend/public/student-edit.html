<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chỉnh sửa Học Sinh</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">✏️ Cập nhật Học Sinh</h4>
      </div>
      <div class="card-body">
        <form id="editForm" class="needs-validation" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Tên học sinh</label>
            <input type="text" id="name" class="form-control" required>
            <div class="invalid-feedback">Vui lòng nhập tên học sinh.</div>
          </div>

          <div class="mb-3">
            <label for="description" class="form-label">Mô tả</label>
            <textarea id="description" class="form-control" rows="3"></textarea>
          </div>

          <div class="mb-3">
            <label for="avatar" class="form-label">Ảnh đại diện (URL)</label>
            <input type="text" id="avatar" class="form-control">
          </div>

          <div class="d-flex justify-content-between">
            <a href="students.html" class="btn btn-secondary">⬅️ Quay lại danh sách</a>
            <button type="submit" class="btn btn-success">💾 Lưu thay đổi</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="assets/js/services/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // Lấy id từ URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    async function loadStudent() {
      try {
        const response = await studentService.getById(id);
        if (response.success) {
          const student = Array.isArray(response.data) ? response.data[0] : response.data;
          document.getElementById('name').value = student.name || '';
          document.getElementById('description').value = student.description || '';
          document.getElementById('avatar').value = student.avatar || '';
        }
      } catch (err) {
        console.error('Error:', err);
        alert('Không thể tải dữ liệu học sinh');
      }
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('name').value.trim(),
        description: document.getElementById('description').value.trim(),
        avatar: document.getElementById('avatar').value.trim()
      };

      try {
        await studentService.update(id, data);
        alert('Cập nhật thành công!');
        window.location.href = 'students.html';
      } catch (err) {
        console.error('Update error:', err);
        alert('Không thể cập nhật học sinh');
      }
    });

    loadStudent();
  </script>
</body>
</html>
