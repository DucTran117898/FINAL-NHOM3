<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Trường Học</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="layout-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">📚 Quản Lý Trường</div>
            <ul class="sidebar-menu" id="sidebarMenu">
                <li><a href="index.html" class="nav-link active" data-page="dashboard">🏠 Dashboard</a></li>
                <li><a href="subjects.html" class="nav-link" data-page="subjects">📖 Môn Học</a></li>
                <li><a href="teachers.html" class="nav-link" data-page="teachers">👨‍🏫 Giáo Viên</a></li>
                <li><a href="students.html" class="nav-link" data-page="students">👨‍🎓 Học Sinh</a></li>
                <li><a href="scores.html" class="nav-link" data-page="scores">📊 Điểm Số</a></li>
                <li><a href="api/docs/" class="nav-link" target="_blank">📖 API Docs</a></li>
                <li>
    <a href="admin-reset.html" class="nav-link" style="display: flex; align-items: center; justify-content: space-between;">
        <span>🔐 Duyệt Reset</span>
        <span id="reset-badge" style="
            display: none;
            background-color: #ff4757;
            color: white;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
        ">0</span>
    </a>
</li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h1 class="header-title" id="headerTitle">Dashboard</h1>
                    <!-- Login Info Section -->
                    <div class="login-info">
                        <div class="login-info-item">
                            <span class="login-info-label">Tên login:</span>
                            <span class="login-info-value" id="loginIdDisplay">-</span>
                        </div>
                        <div class="login-info-item">
                            <span class="login-info-label">Vai trò:</span>
                            <span class="login-info-value" id="roleDisplay">-</span>
                        </div>
                        <div class="login-info-item">
                            <span class="login-info-label">Thời gian login:</span>
                            <span class="login-info-value" id="loginTimeDisplay">-</span>
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <div class="user-menu">
                        <span class="user-avatar" id="userAvatar">AD</span>
                        <button class="logout-btn" id="logoutBtn">Đăng Xuất</button>
                    </div>
                </div>
            </header>

            <!-- Alert Container -->
            <div id="alertContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999; max-width: 400px;">
            </div>

            <!-- Content Area -->
            <div class="content" id="content">
                <!-- Content will be dynamically loaded here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/services/api.js"></script>
    <script src="assets/js/utils/helpers.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        async function checkPendingResets() {
            try {
                const res = await authService.getPendingResets();
                const badge = document.getElementById('reset-badge');

                if (res.success && res.data && res.data.length > 0) {
                    badge.innerText = res.data.length;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (error) {
            }
        }

        document.addEventListener('DOMContentLoaded', checkPendingResets);
        setInterval(checkPendingResets, 5000);
    </script>
</body>

</html>
