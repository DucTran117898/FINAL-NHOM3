<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Trường Học</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="dashboard-full-page">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="login-info-vertical">
                <div class="login-info-item">
                    <span class="login-info-label">Tên login:</span>
                    <span class="login-info-value" id="loginIdDisplay">-</span>
                </div>
                <div class="login-info-item">
                    <span class="login-info-label">Thời gian login:</span>
                    <span class="login-info-value" id="loginTimeDisplay">-</span>
                </div>
                <div class="login-info-item">
                    <span class="login-info-label">Vai trò:</span>
                    <span class="login-info-value" id="roleDisplay">-</span>
                </div>
            </div>
            <div class="header-right">
                <div class="user-menu">
                    <span class="user-avatar" id="userAvatar">AD</span>
                    <button class="logout-btn" id="logoutBtn">Đăng Xuất</button>
                </div>
            </div>
        </header>

        <!-- Alert Container -->
        <div id="alertContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999; max-width: 400px;">
        </div>

        <!-- Dashboard Grid - Full Width -->
        <div class="dashboard-grid-full" id="dashboardGrid">
                    <!-- Phòng học Column -->
                    <div class="dashboard-column">
                        <h3 class="dashboard-column-title">Phòng học</h3>
                        <div class="dashboard-column-buttons">
                            <button class="dashboard-btn dashboard-btn-search" onclick="window.location.href='#'">Tìm kiếm</button>
                            <button class="dashboard-btn dashboard-btn-add" onclick="window.location.href='#'">Thêm mới</button>
                        </div>
                    </div>

                    <!-- Giáo viên Column -->
                    <div class="dashboard-column">
                        <h3 class="dashboard-column-title">Giáo viên</h3>
                        <div class="dashboard-column-buttons">
                            <button class="dashboard-btn dashboard-btn-search" onclick="window.location.href='teachers.html'">Tìm kiếm</button>
                            <button class="dashboard-btn dashboard-btn-add" onclick="window.location.href='teacher_register.html'">Thêm mới</button>
                        </div>
                    </div>

                    <!-- Môn học Column -->
                    <div class="dashboard-column">
                        <h3 class="dashboard-column-title">Môn học</h3>
                        <div class="dashboard-column-buttons">
                            <button class="dashboard-btn dashboard-btn-search" onclick="window.location.href='subjects/index.html'">Tìm kiếm</button>
                            <button class="dashboard-btn dashboard-btn-add" onclick="window.location.href='subjects/add.html'">Thêm mới</button>
                        </div>
                    </div>

                    <!-- Sinh viên Column -->
                    <div class="dashboard-column">
                        <h3 class="dashboard-column-title">Sinh viên</h3>
                        <div class="dashboard-column-buttons">
                            <button class="dashboard-btn dashboard-btn-search" onclick="window.location.href='students/index.html'">Tìm kiếm</button>
                            <button class="dashboard-btn dashboard-btn-add" onclick="window.location.href='students/student-edit.html'">Thêm mới</button>
                        </div>
                    </div>

                    <!-- Điểm Column -->
                    <div class="dashboard-column">
                        <h3 class="dashboard-column-title">Điểm</h3>
                        <div class="dashboard-column-buttons">
                            <button class="dashboard-btn dashboard-btn-search" onclick="window.location.href='scores.html'">Tìm kiếm</button>
                            <button class="dashboard-btn dashboard-btn-add" onclick="window.location.href='scores.html'">Thêm mới</button>
                        </div>
                    </div>
                </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/services/api.js"></script>
    <script src="assets/js/utils/helpers.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        async function checkPendingResets() {
            try {
                const res = await authService.getPendingResets();
                const badge = document.getElementById('reset-badge');

                if (res.success && res.data && res.data.length > 0) {
                    badge.innerText = res.data.length;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (error) {
            }
        }

        document.addEventListener('DOMContentLoaded', checkPendingResets);
        setInterval(checkPendingResets, 5000);
    </script>
</body>

</html>
