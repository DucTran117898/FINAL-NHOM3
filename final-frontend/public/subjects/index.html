<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Môn Học - Hệ Thống Quản Lý Trường Học</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <div class="layout-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">📚 Quản Lý Trường</div>
            <ul class="sidebar-menu">
                <li><a href="index.html" class="nav-link" data-page="dashboard">🏠 Dashboard</a></li>
                <li><a href="index.html" class="nav-link active" data-page="subjects">📖 Môn Học</a></li>
                <li><a href="teachers.html" class="nav-link" data-page="teachers">👨‍🏫 Giáo Viên</a></li>
                <li><a href="students.html" class="nav-link" data-page="students">👨‍🎓 Học Sinh</a></li>
                <li><a href="scores.html" class="nav-link" data-page="scores">📊 Điểm Số</a></li>
                <li><a href="api/docs/" class="nav-link" target="_blank">📖 API Docs</a></li>
            </ul>
        </aside>

        <div class="main-content">
            <header class="header">
                <h1 class="header-title">Quản Lý Môn Học</h1>
                <div class="header-right">
                    <div class="user-menu">
                        <span class="user-avatar" id="userAvatar">AD</span>
                        <button class="logout-btn" id="logoutBtn">Đăng Xuất</button>
                    </div>
                </div>
            </header>

            <div id="alertContainer" style="position: fixed; top: 20px; right: 20px; z-index: 9999; max-width: 400px;">
            </div>

            <div class="content">
                <div style="margin-bottom: 20px;">
                    <a href="add.html" class="btn btn-primary" style="text-decoration: none;">➕ Thêm Môn
                        Học</a>
                    <div class="search-bar" style="display: inline-block; margin-left: 10px;">
                        <input type="text" id="searchInput" placeholder="Tìm kiếm môn học..." style="min-width: 250px;">
                        <button class="btn btn-outline" id="searchBtn">🔍 Tìm</button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table id="subjectsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên Môn Học</th>
                                <th>Mô Tả</th>
                                <th>Ngày Tạo</th>
                                <th>Hành Động</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="5" style="text-align: center; padding: 40px;">Đang tải dữ liệu...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div id="paginationContainer"></div>
            </div>
        </div>
    </div>

    <!-- Modal Add/Edit Subject -->
    <div class="modal" id="subjectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Thêm Môn Học</h2>
                <span class="modal-close" id="modalClose">&times;</span>
            </div>
            <div class="modal-body">
                <form id="subjectForm">
                    <div class="form-group">
                        <label for="name">Tên Môn Học:</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Mô Tả:</label>
                        <textarea id="description"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="cancelBtn">Hủy</button>
                <button type="button" class="btn btn-primary" id="saveBtn">Lưu</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/services/api.js"></script>
    <script src="../assets/js/utils/helpers.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/pages/subjects.js"></script>
</body>

</html>
