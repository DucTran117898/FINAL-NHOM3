<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: Arial, sans-serif;
        }
        .container {
            background: white; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px; background: #667eea; color: white; border: none;
            border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
        button:hover { background: #5a6fd6; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #667eea; text-decoration: none; }
        .error { color: red; font-size: 14px; margin-top: 5px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔒 Khôi Phục Mật Khẩu</h2>
        <div class="form-group">
            <label>Nhập User ID (Tên đăng nhập)</label>
            <input type="text" id="login_id" placeholder="Ví dụ: admin">
            <div id="error-msg" class="error"></div>
        </div>
        <button onclick="guiYeuCau()" id="btnSubmit">Gửi Yêu Cầu</button>
        <a href="login.html" class="back-link">Quay lại Đăng nhập</a>
    </div>

    <script src="assets/js/services/api.js"></script>
    <script>
        async function guiYeuCau() {
            const loginId = document.getElementById('login_id').value.trim();
            const errorDiv = document.getElementById('error-msg');
            const btn = document.getElementById('btnSubmit');

            // Reset trạng thái
            errorDiv.style.display = 'none';
            errorDiv.innerText = '';
            
            if (!loginId) {
                errorDiv.innerText = 'Vui lòng nhập User ID';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                btn.innerText = 'Đang gửi...';
                btn.disabled = true;

                // Gọi hàm requestReset trong api.js
                const res = await authService.requestReset(loginId);

                if (res.success) {
                    alert('✅ Đã gửi yêu cầu thành công!');
                    window.location.href = 'login.html';
                } else {
                    errorDiv.innerText = res.message || 'Có lỗi xảy ra';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error(error);
                alert('❌ Lỗi kết nối: ' + error.message);
            } finally {
                btn.innerText = 'Gửi Yêu Cầu';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
