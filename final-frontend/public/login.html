<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Quản Lý Trường Học</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .login-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
        }

        .login-btn:hover {
            background-color: var(--primary-dark);
        }

        .login-btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-password a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: var(--danger);
            font-size: 14px;
            margin-top: 5px;
        }

        .loading {
            display: none;
        }

        .loading.show {
            display: inline-block;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 20px;
            }

            .login-title {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">📚</div>
            <h1 class="login-title">Quản Lý Trường Học</h1>
            <p class="login-subtitle">Đăng nhập để tiếp tục</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginId">Người dùng:</label>
                <input type="text" id="loginId" name="loginId" required placeholder="Nhập login id của bạn">
                <span class="error-message" id="loginIdError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu của bạn">
                <span class="error-message" id="passwordError"></span>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span id="btnText">Đăng Nhập</span>
                <span class="spinner loading" id="btnSpinner"></span>
            </button>

        </form>

        <div class="forgot-password">
            <a href="/reset-password.html">Quên mật khẩu?</a>
        </div>
    </div>

    <script src="assets/js/services/api.js"></script>
    <script src="assets/js/utils/helpers.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already logged in, redirect to home
            const token = localStorage.getItem('authToken');
            if (token) {
                window.location.href = 'index.html';
            }

            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const loginIdInput = document.getElementById('loginId');
            const passwordInput = document.getElementById('password');

            // Handle input changes - clear specific field error when user starts typing
            loginIdInput.addEventListener('input', () => {
                if (document.getElementById('loginIdError').textContent) {
                    document.getElementById('loginIdError').textContent = '';
                    loginIdInput.classList.remove('error');
                }
            });

            passwordInput.addEventListener('input', () => {
                if (document.getElementById('passwordError').textContent) {
                    document.getElementById('passwordError').textContent = '';
                    passwordInput.classList.remove('error');
                }
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Clear previous errors
                clearErrors();

                const loginId = loginIdInput.value.trim();
                const password = passwordInput.value;

                try {
                    loginBtn.disabled = true;
                    btnText.textContent = 'Đang đăng nhập...';
                    btnSpinner.classList.add('show');

                    const response = await authService.login(loginId, password);

                    if (response && response.success && response.token) {
                        // Store token and user info
                        apiClient.setToken(response.token);
                        if (response.user) {
                            StorageUtils.set('user', response.user);
                        }

                        // Redirect to home page
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 500);
                    } else {
                        // Handle server errors
                        if (response && response.errors) {
                            displayErrors(response.errors);
                        } else {
                            showError('loginId', 'Đăng nhập thất bại. Vui lòng thử lại.');
                        }
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError('loginId', 'Login id và password không đúng');
                } finally {
                    loginBtn.disabled = false;
                    btnText.textContent = 'Đăng Nhập';
                    btnSpinner.classList.remove('show');
                }
            });

            function clearErrors() {
                document.getElementById('loginIdError').textContent = '';
                document.getElementById('passwordError').textContent = '';
                loginIdInput.classList.remove('error');
                passwordInput.classList.remove('error');
            }

            function showError(fieldId, message) {
                const errorElement = document.getElementById(fieldId + 'Error');
                const inputElement = document.getElementById(fieldId);
                if (errorElement) {
                    errorElement.textContent = message;
                    inputElement.classList.add('error');
                }
            }

            function displayErrors(errors) {
                if (errors.login_id) {
                    showError('loginId', errors.login_id);
                }
                if (errors.password) {
                    showError('password', errors.password);
                }
            }
        });
    </script>
</body>

</html>
