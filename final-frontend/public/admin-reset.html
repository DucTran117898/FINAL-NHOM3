<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Duyệt Reset</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { padding: 40px; background: #f4f6f9; font-family: Arial, sans-serif; }
        .container {
            background: white; padding: 30px; border-radius: 8px; max-width: 900px; margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { color: #333; margin-bottom: 20px; border-bottom: 2px solid #667eea; padding-bottom: 10px;}
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #667eea; color: white; padding: 12px; text-align: center; }
        td { border-bottom: 1px solid #eee; padding: 12px; text-align: center; vertical-align: middle; }
        input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 200px; }
        button { background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        .home-link { display: inline-block; margin-bottom: 20px; color: #667eea; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="home-link">← Về trang chủ</a>
        <h2>Danh sách yêu cầu Reset Password</h2>

<table>
    <thead>
        <tr>
            <th style="width: 50px;">NO</th>
            <th>Tên người dùng</th> <th>Mật khẩu mới</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        <tr><td colspan="4">Đang tải dữ liệu...</td></tr>
    </tbody>
</table>
    </div>

    <script src="assets/js/services/api.js"></script>
<script>
    // Biến lưu trữ dữ liệu cũ để so sánh
    let previousDataString = '';

    // Hàm load danh sách
    async function loadData() {
        try {
            // Gọi API lấy danh sách (Chạy ngầm)
            const res = await authService.getPendingResets();
            const tbody = document.getElementById('tableBody');

            if (res.success) {
                const data = res.data || [];

                // --- LOGIC THÔNG MINH ---
                // Chuyển dữ liệu mới thành chuỗi để so sánh với dữ liệu cũ
                const currentDataString = JSON.stringify(data);

                // Nếu dữ liệu Y HỆT lần trước -> DỪNG LẠI NGAY (Không vẽ lại bảng)
                // Giúp Admin đang gõ mật khẩu không bị mất chữ
                if (currentDataString === previousDataString) {
                    return; 
                }

                // Nếu có sự khác biệt (có người mới gửi) -> Cập nhật lại biến lưu trữ
                previousDataString = currentDataString;
                // -----------------------

                // Bắt đầu vẽ lại bảng
                tbody.innerHTML = ''; 

                if (data.length > 0) {
                    data.forEach((user, index) => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${index + 1}</td>
                                <td><strong>${user.login_id}</strong></td>
                                <td>
                                    <input type="text" id="pass_${user.id}" placeholder="Mật khẩu mới...">
                                </td>
                                <td>
                                    <button onclick="approve(${user.id})">Duyệt & Reset</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" style="color:#777">Không có yêu cầu nào.</td></tr>';
                }
            }
        } catch (error) {
            console.error('Lỗi auto-update:', error);
            // Không hiện lỗi lên màn hình để tránh làm phiền, chỉ log ra console
        }
    }

    // Hàm duyệt (Giữ nguyên)
    async function approve(id) {
        const passInput = document.getElementById(`pass_${id}`);
        const newPass = passInput.value.trim();

        if (!newPass || newPass.length < 6) {
            alert('Mật khẩu mới phải từ 6 ký tự trở lên!');
            passInput.focus();
            return;
        }

        if(!confirm('Bạn chắc chắn muốn đổi mật khẩu cho user này?')) return;

        try {
            const res = await authService.approveReset(id, newPass);
            if (res.success) {
                alert('✅ Thành công!');
                // Reset biến so sánh để đảm bảo bảng được cập nhật ngay lập tức
                previousDataString = ''; 
                loadData(); 
            } else {
                alert('❌ Lỗi: ' + res.message);
            }
        } catch (error) {
            alert('Lỗi kết nối');
        }
    }

    // 1. Chạy ngay khi mở trang
    loadData();

    // 2. TỰ ĐỘNG CẬP NHẬT: Cứ 2 giây (2000ms) gọi hàm loadData 1 lần
    setInterval(loadData, 2000);

</script>
</body>
</html>
