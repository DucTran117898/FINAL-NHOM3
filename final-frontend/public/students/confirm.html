<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Xác nhận cập nhật</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light" id="confirmPage">

<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header bg-success text-white">
      <h4 class="mb-0">✅ Xác nhận thông tin</h4>
    </div>

    <div class="card-body">
      <div class="mb-3">
        <strong>Tên học sinh:</strong>
        <p id="name"></p>
      </div>

      <div class="mb-3">
        <strong>Mô tả:</strong>
        <p id="description"></p>
      </div>

      <div class="mb-3">
        <strong>Ảnh đại diện:</strong><br>
        <img id="avatarPreview" class="img-thumbnail d-none" style="max-width:180px">
      </div>

      <div class="d-flex justify-content-between">
        <button id="backBtn" class="btn btn-secondary">⬅️ Quay lại</button>
        <button id="confirmBtn" class="btn btn-success">💾 Lưu</button>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/services/api.js"></script>
<script src="../assets/js/pages/students-edit.js"></script>
</body>
</html>
