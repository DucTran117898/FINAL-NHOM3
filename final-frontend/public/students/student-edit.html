<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chỉnh sửa Học Sinh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">✏️ Cập nhật Học Sinh</h4>
    </div>

    <div class="card-body">
      <form id="editForm">
        <div class="mb-3">
          <label class="form-label">Tên học sinh</label>
          <input type="text" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Ảnh đại diện</label> <br>
          <img id="avatarPreview" class="img-thumbnail d-none mt-3"
               style="max-width:180px">
          <input type="file" id="avatar" class="form-control" accept="image/*">
          
        </div>

        <div class="mb-3">
          <label class="form-label">Mô tả</label>
          <textarea id="description" class="form-control"></textarea>
        </div>

        <div class="d-flex justify-content-between">
          <a href="index.html" class="btn btn-secondary">⬅️ Quay lại</a>
          <button type="button" class="btn btn-success" onclick="saveToLocal()">Xác nhận</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../assets/js/services/api.js"></script>
<script src="../assets/js/pages/students-edit.js"></script>
</body>
</html>
